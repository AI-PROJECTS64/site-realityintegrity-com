<!-- 404.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RealityIntegrity.com - 404</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://www.realityintegrity.com/404.html" />
  <style>
    :root{
      --bg:#071022; --card:#0b1830; --text:#e9eef9; --muted:#a9b7d6; --line:rgba(255,255,255,.10);
      --shadow: 0 16px 50px rgba(0,0,0,.40); --radius:16px; --max:980px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    body{margin:0; font-family:var(--sans); color:var(--text); background:var(--bg);}
    .wrap{max-width:var(--max); margin:0 auto; padding:28px 18px 44px;}
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px;
      border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
      background: rgba(255,255,255,.03);
    }
    .badge{font-family:var(--mono); font-size:12px; color:var(--muted); border:1px solid var(--line); padding:6px 10px; border-radius:999px; background: rgba(0,0,0,.14);}
    .card{
      margin-top:18px; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
      background: rgba(255,255,255,.03); overflow:hidden;
    }
    .inner{padding:22px 18px;}
    .section-tag{display:inline-block; font-family:var(--mono); font-size:12px; color:var(--muted); border:1px solid var(--line); padding:6px 10px; border-radius:999px; background: rgba(0,0,0,.14); margin-bottom:14px;}
    h1{margin:0 0 8px; font-size:30px;}
    p{margin:10px 0; line-height:1.55; color: rgba(233,238,249,.95);}
    a{color:inherit;}
    .btn{
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid var(--line); border-radius:12px; padding:10px 12px;
      text-decoration:none; background: rgba(0,0,0,.14);
      font-weight:650;
    }
    .btn.primary{border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.06);}
    .foot{
      margin-top:18px; font-size:12.5px; color:var(--muted); line-height:1.55;
      border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background: rgba(0,0,0,.12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div><a href="/" style="text-decoration:none; font-weight:700;">RealityIntegrity.com</a></div>
      <div class="badge">404</div>
    </div>

    <section class="card">
      <div class="inner">
        <div class="section-tag">Not Found</div>
        <h1>Page not found</h1>
        <p>Sorry, the page you are looking for does not exist.</p>
        <p><a class="btn primary" href="/">Back to main page</a></p>
      </div>
    </section>

    <div class="foot">
      RealityIntegrity.com is an independent, vendor-neutral reference site. No certification. No legal advice. No regulated assurance services.
    </div>
  </div>
</body>
</html>
